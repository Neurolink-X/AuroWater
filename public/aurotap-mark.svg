    <path d="M64 12C51 29 27 50 27 73a37 37 0 0 0 74 0C101 50 77 29 64 12Z" fill="#fff" fill-opacity=".12"/>
    <g clip-path="url(#dropClip)">
      <path d="M24 76Q42 67 60 76T96 76T114 76V116H24Z" fill="#fff" fill-opacity=".16"/>
      <ellipse cx="48" cy="51" rx="5" ry="14" fill="#fff" fill-opacity=".45" transform="rotate(-20 48 51)"/>
