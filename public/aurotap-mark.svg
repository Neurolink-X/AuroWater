<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AuroTap water drop">
  <defs>
    <linearGradient id="drop" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="42%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
