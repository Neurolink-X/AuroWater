name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_technician_stage_e2e:
        description: 'Run real technician/admin service approval E2E against isolated staging'
        type: boolean
        required: false
        default: false
      run_platform_stage_role_matrix:
        description: 'Run read-only cross-role staging API authorization checks'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, regression, build
    runs-on: ubuntu-24.04

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Always runs when ANY application code changes; not regex-only verification.
      - name: Technician role and service approval lifecycle contract
        run: npm run test:technician:contract

      - name: Platform-wide role, route and dependency contracts
        run: npm run test:platform:contract
        env:
          PLATFORM_DIFF_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Regression tests
        run: npm run test:regression

      - name: Migration inventory audit (informational until production history is reconciled)
        run: npm run db:audit-migrations
        continue-on-error: true

      - name: Production build
        run: npm run build

      - name: Client bundle budget report
        run: npm run perf:bundle-report

  technician-stage-e2e:
    name: Authenticated technician lifecycle - isolated staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_technician_stage_e2e }}
    needs: quality
    runs-on: ubuntu-24.04
    environment: staging-e2e
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run real KYC to admin service activation + rejection sequence
        env:
          TECHNICIAN_STAGE_URL: ${{ vars.TECHNICIAN_STAGE_URL }}
          TECHNICIAN_STAGE_DB_ISOLATED: ${{ vars.TECHNICIAN_STAGE_DB_ISOLATED }}
          TECHNICIAN_STAGE_SUPABASE_URL: ${{ vars.TECHNICIAN_STAGE_SUPABASE_URL }}
          TECHNICIAN_STAGE_SUPABASE_ANON_KEY: ${{ vars.TECHNICIAN_STAGE_SUPABASE_ANON_KEY }}
          TECHNICIAN_STAGE_EMAIL: ${{ secrets.TECHNICIAN_STAGE_EMAIL }}
          TECHNICIAN_STAGE_PASSWORD: ${{ secrets.TECHNICIAN_STAGE_PASSWORD }}
          ADMIN_STAGE_EMAIL: ${{ secrets.ADMIN_STAGE_EMAIL }}
          ADMIN_STAGE_PASSWORD: ${{ secrets.ADMIN_STAGE_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
        run: npm run test:technician:stage

  platform-stage-roles:
    name: Read-only role matrix - isolated staging
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_platform_stage_role_matrix }}
    needs: quality
    runs-on: ubuntu-24.04
    environment: staging-e2e
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cross-role read-only HTTP matrix (all 4 roles)
        env:
          PLATFORM_STAGE_URL: ${{ vars.PLATFORM_STAGE_URL }}
          PLATFORM_STAGE_DB_ISOLATED: ${{ vars.PLATFORM_STAGE_DB_ISOLATED }}
          PLATFORM_STAGE_SUPABASE_URL: ${{ vars.PLATFORM_STAGE_SUPABASE_URL }}
          PLATFORM_STAGE_SUPABASE_ANON_KEY: ${{ vars.PLATFORM_STAGE_SUPABASE_ANON_KEY }}
          PLATFORM_STAGE_CUSTOMER_EMAIL: ${{ secrets.PLATFORM_STAGE_CUSTOMER_EMAIL }}
          PLATFORM_STAGE_CUSTOMER_PASSWORD: ${{ secrets.PLATFORM_STAGE_CUSTOMER_PASSWORD }}
          PLATFORM_STAGE_SUPPLIER_EMAIL: ${{ secrets.PLATFORM_STAGE_SUPPLIER_EMAIL }}
          PLATFORM_STAGE_SUPPLIER_PASSWORD: ${{ secrets.PLATFORM_STAGE_SUPPLIER_PASSWORD }}
          PLATFORM_STAGE_TECHNICIAN_EMAIL: ${{ secrets.PLATFORM_STAGE_TECHNICIAN_EMAIL }}
          PLATFORM_STAGE_TECHNICIAN_PASSWORD: ${{ secrets.PLATFORM_STAGE_TECHNICIAN_PASSWORD }}
          PLATFORM_STAGE_ADMIN_EMAIL: ${{ secrets.PLATFORM_STAGE_ADMIN_EMAIL }}
          PLATFORM_STAGE_ADMIN_PASSWORD: ${{ secrets.PLATFORM_STAGE_ADMIN_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
        run: npm run test:platform:stage
