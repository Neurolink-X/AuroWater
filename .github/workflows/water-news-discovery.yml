name: Free water-news discovery for editorial review

# Every Sunday: fetch last 7 days -> filter -> save as DRAFTS -> one review PR.
# Nothing unverified is written to src/data/water-news-reviewed.json.
on:
  schedule:
    - cron: '13 3 * * 0' # Sunday 03:13 UTC = 08:43 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Shared with editorial-evergreen-publish.yml: only one writer at a time across machines.
concurrency:
  group: water-news-store
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRANCH: bot/water-news-review
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Load existing review queue (if a review PR is still open)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content
          if git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            for f in water-news-drafts.json water-news-drafts.quarantine.json; do
              # Temp file first: a failed `git show` must not leave an empty (invalid) JSON file.
              if git show "origin/$BRANCH:content/$f" > "$RUNNER_TEMP/$f"; then
                mv "$RUNNER_TEMP/$f" "content/$f"
              fi
            done
          fi

      - name: Repair store, discover last 7 days of headlines (untrusted), save drafts
        run: node scripts/publish-water-news.mjs --repair --max=3 --max-age-days=7 --verbose

      # Runs even if discovery failed (feed down): repair results are still proposed.
      - name: Propose review PR (never auto-publishes)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files="content/water-news-drafts.json content/water-news-drafts.quarantine.json"
          existing=""
          for f in $files; do [ -f "$f" ] && existing="$existing $f"; done
          if [ -z "$existing" ] || [ -z "$(git status --porcelain -- $existing)" ]; then
            echo "No changes to propose."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/queue"
          cp $existing "$RUNNER_TEMP/queue/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          for f in $existing; do cp "$RUNNER_TEMP/queue/$(basename "$f")" "$f"; done
          git add $existing
          if git diff --cached --quiet; then
            echo "Queue unchanged."
            exit 0
          fi
          git commit -m "content: water news drafts for editorial review"
          git push origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            echo "Existing editor-review PR updated."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Editorial review: water news drafts (NOT verified)" \
              --body "Headline-only leads from Google News. **Not fact-checked.** Verify each against the publisher's report. For items you approve, set \`\"editor_approved\": true\` in content/water-news-drafts.json, delete the rest, merge, then run 'editorial-evergreen-publish' manually. Nothing here is in src/data/water-news-reviewed.json yet."
          fi
