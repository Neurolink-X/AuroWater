name: AuroTap self-healing incident watchdog (free)
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aurotap-health-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public health and pages with bounded retries
        id: check
        continue-on-error: true
        env:
          BASE_URL: https://www.aurotap.in
        run: node scripts/check-site-health.mjs
      - name: Create / update incident safely (never change prod code automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          marker='[AUTOMATED-HEALTH-WATCHDOG]'
          number="$(gh issue list --state open --limit 100 --json number,title -q ".[] | select(.title | contains(\"$marker\")) | .number" | head -n 1)"
          if [[ "$RESULT" == "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --body "Health checks recovered after retries on $(date -u +%FT%TZ). Closing incident; confirm stability via deployment logs."
              gh issue close "$number"
            fi
          else
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --body "Still degraded at $(date -u +%FT%TZ). Review Vercel logs, Supabase advisors, and last deployment before a manual rollback. No production mutation attempted."
            else
              gh issue create --title "$marker Production health checks degraded" --body "Watchdog observed repeated failures in public health/home/blog/settings endpoints. Inspect Vercel and Supabase logs, isolate the failing endpoint, and consider a human-approved rollback to the previous healthy deployment. This monitor does NOT edit code, change settings, or trigger a rollback."
            fi
          fi
