name: SEO indexability observability (free)
on:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public SEO visibility
        env:
          SEO_BASE_URL: https://www.aurotap.in
        run: node scripts/audit-public-seo.mjs
