name: Temporary one-shot lockfile regeneration (remove after run)
on:
  push:
    branches: [fix/news-db-gitignore-20261106]
    paths:
      - .github/workflows/repair-lockfile-once.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lockfile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/news-db-gitignore-20261106
          persist-credentials: true
      - name: Set up same Node version as CI
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile only; no package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile supports a clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify strict change allowlist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git diff --name-only -- . ':(exclude)package-lock.json')" ]]; then
            echo "::error::Unexpected files changed during lockfile resolution."
            git diff --name-only
            exit 1
          fi
          if git diff --quiet -- package-lock.json; then
            echo "::notice::Lockfile already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "fix(ci): synchronize npm lockfile with package manifest"
          git push origin HEAD:fix/news-db-gitignore-20261106
