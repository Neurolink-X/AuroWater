
name: CodeQL Security Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  schedule:
    # Monday 09:53 AM IST (04:23 UTC)
    - cron: '23 4 * * 1'

  workflow_dispatch:

# Default permissions: read-only.
permissions:
  contents: read

# Cancel outdated PR scans, but do not interrupt
# scheduled or manually started security scans.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ============================================================
  # 1. JAVASCRIPT AND TYPESCRIPT SECURITY ANALYSIS
  # ============================================================

  analyze:
    name: Analyze JavaScript and TypeScript

    runs-on: ubuntu-24.04
    timeout-minutes: 35

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL for JS/TS
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # ============================================================
  # 2. GITHUB ACTIONS WORKFLOW SECURITY ANALYSIS
  # ============================================================

  analyze-workflows:
    name: Analyze GitHub Actions Security

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL for GitHub Actions
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze workflow security
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
