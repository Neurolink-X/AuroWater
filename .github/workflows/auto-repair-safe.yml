name: Safe autonomous maintenance repair (propose PR)
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: safe-autorepair-suppressions
  cancel-in-progress: false

jobs:
  deterministic-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - name: Generate only known-safe suppression cleanup
        shell: bash
        run: |
          set -euo pipefail
          # The configured lint command prunes stale suppression entries.
          # New lint errors cannot be automatically suppressed or edited.
          npm run lint || true
          if git diff --quiet -- eslint-suppressions.json; then
            echo "No deterministic repair required."
            exit 0
          fi
          if [[ -n "$(git diff --name-only | grep -v '^eslint-suppressions.json$' || true)" ]]; then
            echo "Refusing unexpected generated changes."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('eslint-suppressions.json','utf8'))"
          npm run lint
          npm run test:unit
          npm run test:regression
      - name: Open reviewed repair PR (never auto-merge)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- eslint-suppressions.json; then
            echo "No repair to propose."
            exit 0
          fi
          branch='bot/safe-lint-suppressions-repair'
          cp eslint-suppressions.json "$RUNNER_TEMP/suppressions.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          cp "$RUNNER_TEMP/suppressions.json" eslint-suppressions.json
          git add eslint-suppressions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ci): prune obsolete lint suppressions'
          git push origin "$branch"
          if ! gh pr list --head "$branch" --state open --json number -q '.[0].number' | grep -q '[0-9]'; then
            gh pr create --base main --head "$branch" --title 'Auto-repair: safely prune obsolete lint suppressions' --body 'Generated by a strict allowlisted repair. Only eslint-suppressions.json changed. Lint, unit and regression checks passed. Human review and full CI required. No production deploy or database action.'
          fi
