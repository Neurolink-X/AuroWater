name: Publish editor-approved water news briefs

# Manual only. Run on main AFTER the review PR is merged.
# Appends drafts with "editor_approved": true to src/data/water-news-reviewed.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: water-news-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate drafts
        run: node scripts/auto-publish-water-news.mjs --validate
      - name: Promote editor-approved drafts (append only)
        run: node scripts/auto-publish-water-news.mjs --promote
      - name: Commit published store
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/data/water-news-reviewed.json content/water-news-drafts.json)" ]; then
            echo "Nothing promoted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/water-news-reviewed.json content/water-news-drafts.json
          git commit -m "content: publish editor-approved water news briefs"
          git push origin HEAD:main
