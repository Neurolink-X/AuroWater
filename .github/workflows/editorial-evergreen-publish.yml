name: Publish preapproved evergreen blog guides
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-evergreen-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Three-day cadence
        id: cadence
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if (( day % 3 == 0 )); then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Generate one preapproved evergreen guide
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/publish-editorial-guides.mjs
      - name: Publish only if editorial store changed
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/auto-guides.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/auto-guides.json
          git commit -m "content: publish scheduled preapproved evergreen guide"
          git push origin HEAD:main
