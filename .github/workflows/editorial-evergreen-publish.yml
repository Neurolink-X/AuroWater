name: Weekly automatic water news brief
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-evergreen-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable scheduled or manual run
        id: cadence
        run: echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Fetch and prepare one attributed current news brief
        if: steps.cadence.outputs.run == 'true'
        run: node scripts/auto-publish-water-news.mjs
      - name: Publish only if editorial store changed
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/water-news-reviewed.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/water-news-reviewed.json
          git commit -m "content: publish weekly attributed water news brief"
          git push origin HEAD:main
